[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barnard-exact"
version = "0.1.0"
description = "Barnard's and Boschloo's exact tests for 2x2 tables (free core)"
readme = "README.md"
authors = [{name = "Groundplane Labs"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
keywords = ["barnard test", "boschloo test", "exact test", "fisher exact test", "statistics", "biostatistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://groundplane0.gumroad.com/l/conxfk"

[tool.setuptools.packages.find]
where = ["src"]
